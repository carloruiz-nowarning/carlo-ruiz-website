<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Happy Camper Distro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#004833;--cream:#F4F1E6;--yellow:#F0E66D;--orange:#D28113;--ink:#2C3028;
  --disp:'Bowlby One',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,monospace;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--green);color:var(--cream);
  font-family:var(--body);text-align:center;padding:24px}
.wrap{max-width:520px}
h1{font-family:var(--disp);text-transform:uppercase;font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0 0 10px}
p.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);margin:0 0 18px}
p.sub{color:rgba(244,241,230,.78);font-size:15px;margin:0 0 34px}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;
  padding:16px 28px;border-radius:10px;text-decoration:none;border:2px solid transparent;min-width:200px}
a.btn--yellow{background:var(--yellow);color:var(--green)}
a.btn--ghost{background:transparent;color:var(--cream);border-color:var(--cream)}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">The Happy Camper Distro</p>
    <h1>Wholesale, All In One Place</h1>
    <p class="sub">This page is a placeholder while the site is built out. Pick a tool below.</p>
    <div class="row">
      <a class="btn btn--yellow" href="/basket/">Wholesale Menu</a>
      <a class="btn btn--ghost" href="/internal/">Order Desk</a>
    </div>
  </div>
</body>
</html>
