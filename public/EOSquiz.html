<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EOS Diamond — Find her ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:       #F6EDE3;
    --linen:      #EFE4D2;
    --tan:        #D9C4A9;
    --brass:      #A8834E;
    --brass-deep: #8A6A3B;
    --clay:       #C09A7E;
    --ink:        #3A3129;
    --muted:      #7A6B5C;
    --error:      #A34B3C;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Jost', sans-serif;
    color:var(--ink);
    min-height:100svh;
    overflow-x:hidden;
    background:#1c130c;
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- Case (background) ---------- */
  .case{
    position:fixed; inset:0;
    background:linear-gradient(180deg, #5b3d22 0%, #3c2716 55%, #2a1b0f 100%);
    overflow:hidden;
  }
  .case-rings{ position:absolute; inset:0; }
  .ring{
    position:absolute;
    width:64px; height:64px;
    margin:-32px 0 0 -32px;
    opacity:1;
    transition:opacity .3s ease, transform .3s ease;
    will-change:opacity, transform;
  }
  .ring.hidden{
    opacity:0;
    transform:scale(.7);
  }
  .ring svg{ width:100%; height:100%; display:block; overflow:visible; }

  .frost{
    position:fixed; inset:0;
    backdrop-filter:blur(14px) saturate(.9);
    -webkit-backdrop-filter:blur(14px) saturate(.9);
    background:rgba(246,237,227,0.35);
    transition:backdrop-filter .8s cubic-bezier(.65,0,.35,1), -webkit-backdrop-filter .8s cubic-bezier(.65,0,.35,1), background .8s ease;
    pointer-events:none;
  }
  .frost.clear{
    backdrop-filter:blur(0px) saturate(1);
    -webkit-backdrop-filter:blur(0px) saturate(1);
    background:rgba(246,237,227,0.06);
  }

  /* ---------- Layout / brand mark ---------- */
  .brandmark{
    position:fixed; top:20px; left:0; right:0;
    text-align:center;
    font-family:'Jost', sans-serif;
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--linen);
    opacity:.85;
    pointer-events:none;
    z-index:5;
  }

  .stage{
    position:relative;
    z-index:4;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:76px 18px 32px;
  }

  .panel-wrap{
    width:100%;
    max-width:480px;
  }

  .panel{
    background:rgba(246,237,227,0.9);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:2px;
    padding:32px 24px;
    box-shadow:0 30px 60px -20px rgba(20,12,4,0.45);
    clip-path:inset(0 0 0 0);
    transition:clip-path .35s cubic-bezier(.65,0,.35,1);
  }
  .panel.shut{
    clip-path:inset(50% 0 50% 0);
  }
  .panel-inner{
    transition:opacity .18s ease;
    opacity:1;
  }
  .panel.fading .panel-inner{
    opacity:0;
  }

  @media (min-width:480px){
    .panel{ padding:44px 40px; }
  }

  .eyebrow{
    font-family:'Jost', sans-serif;
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 14px;
  }

  h1,h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    color:var(--ink);
    margin:0 0 10px;
    line-height:1.15;
  }
  h1{ font-size:clamp(30px, 6vw, 42px); }
  h2.prompt{ font-size:clamp(28px, 5vw, 40px); font-weight:400; }

  .lede, .sub{
    font-size:15px;
    color:var(--muted);
    margin:0 0 26px;
    line-height:1.5;
  }

  .cta{
    appearance:none;
    border:none;
    background:var(--brass);
    color:var(--sand);
    font-family:'Jost', sans-serif;
    font-size:15px;
    font-weight:500;
    letter-spacing:.04em;
    padding:14px 28px;
    border-radius:2px;
    cursor:pointer;
    transition:background .2s ease;
  }
  .cta:hover{ background:var(--brass-deep); }
  .cta:focus-visible{ outline:2px solid var(--brass-deep); outline-offset:3px; }

  /* ---------- Options ---------- */
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:0 0 20px;
    list-style:none;
    padding:0;
  }
  .options.grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media (min-width:768px){
    .options.grid2{ grid-template-columns:1fr 1fr 1fr; }
  }

  .option{
    appearance:none;
    width:100%;
    text-align:left;
    background:var(--sand);
    border:1.5px solid transparent;
    box-shadow:inset 0 0 0 0.5px var(--tan);
    border-radius:2px;
    padding:16px 18px;
    font-family:'Jost', sans-serif;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    position:relative;
    transition:border-color .25s ease, background-color .25s ease;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .options.grid2 .option{
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:8px;
    padding:16px 10px;
  }
  .option:hover{ border-color:var(--brass); background:var(--linen); }
  .option:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  .option[aria-checked="true"]{
    border-color:var(--brass);
    border-width:1.5px;
    background:var(--linen);
  }
  .option .icon{ flex:0 0 auto; width:30px; height:30px; color:var(--brass); }
  .option .icon svg{ width:100%; height:100%; display:block; }
  .option .label{ flex:1 1 auto; }
  .options.grid2 .option .label{ font-size:13px; line-height:1.3; }

  .check{
    position:absolute;
    top:8px; right:8px;
    width:16px; height:16px;
    color:var(--brass);
    opacity:0;
    transition:opacity .2s ease;
  }
  .option[aria-checked="true"] .check{ opacity:1; }

  .diamond-mini{
    width:16px; height:16px;
    color:var(--brass-deep);
    opacity:.7;
    margin-top:2px;
  }
  .options.grid2 .diamond-mini{ margin-top:4px; }

  .back-link{
    display:inline-block;
    background:none;
    border:none;
    padding:0;
    font-family:'Jost', sans-serif;
    font-size:12px;
    color:var(--muted);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .back-link:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

  /* ---------- Form ---------- */
  .field{ margin:0 0 16px; }
  .field label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin:0 0 6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:'Jost', sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--sand);
    border:1.5px solid var(--tan);
    border-radius:2px;
    padding:11px 12px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--brass);
    outline-offset:1px;
    border-color:var(--brass);
  }
  .field textarea{ min-height:80px; resize:vertical; }
  .field[aria-invalid="true"] input,
  .field.invalid input, .field.invalid select, .field.invalid textarea{
    border-color:var(--error);
  }
  .field-error{
    font-size:13px;
    color:var(--error);
    margin:6px 0 0;
  }
  .req{ color:var(--brass-deep); }

  /* ---------- Reveal ---------- */
  .spec{
    font-family:'Cormorant Garamond', serif;
    color:var(--brass-deep);
    font-size:clamp(20px, 4vw, 26px);
    margin:0 0 16px;
  }
  .reveal-body{
    font-size:15px;
    color:var(--ink);
    line-height:1.6;
    margin:0 0 18px;
  }
  .reveal-list{
    list-style:none;
    padding:0;
    margin:0 0 22px;
    font-size:14px;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .reveal-list li::before{
    content:"—  ";
    color:var(--brass);
  }
  .reveal-note{
    font-size:13px;
    color:var(--muted);
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    .ring, .panel, .panel-inner, .frost{ transition-duration:.001ms !important; }
  }
</style>
</head>

<main class="stage">
  <div class="panel-wrap">
    <div class="panel" id="panel">
      <div class="panel-inner" id="panelInner"></div>

      ]
    },
    {
      key: 'q5_honeymoon',
      prompt: 'How are you spending your honeymoon?',
      grid: true,
      options: [
        { label:'Passionate Greek getaway', icon:'sailboat', attr:{ shape:'Pear' } },
        { label:'Live the city life', icon:'citySkyline', attr:{ shape:'Marquise' } },
        { label:'Tropical paradise', icon:'palm', attr:{ shape:'Round' } },
        { label:'Castle in Europe', icon:'castle', attr:{ shape:'Princess' } },
        { label:'Blossoms in Kyoto', icon:'blossomBranch', attr:{ shape:'Emerald' } },
        { label:'Vineyards in Italy', icon:'grapeCluster', attr:{ shape:'Oval' } }
      ]
    },
    {
      key: 'q6_ringsize',
      prompt: 'Do you know her ring size?',
      grid: false,
      options: [
        { label:'Yes, I know it', icon:'ruler' },
        { label:'I can send in one of her rings', icon:'package' },
        { label:'No idea yet', icon:'questionCircle' }
      ]
    },
    {
      key: 'q7_matchingband',
      prompt: 'Interested in a matching wedding band down the line?',
      grid: false,
      options: [
        { label:'Yes, definitely', icon:'bandsInterlocking' },
        { label:'Maybe later', icon:'bandSingle' },
        { label:'Not right now', icon:'bandFaded' }
      ]
    }
  ];

  var SCREENS = ['welcome','q1','q2','q3','q4','q5','q6','q7','form','reveal'];
  var RING_COUNTS = { welcome:24, q1:24, q2:18, q3:13, q4:9, q5:5, q6:3, q7:3, form:2, reveal:1 };

  var METAL_LABEL = { 'Yellow gold':'Yellow gold', 'White metal':'White metal' };

  /* ============ State ============ */

  var state = {
    screenIndex: 0,
    answers: {},         // key -> label chosen
    ring: {},             // metal/shape/setting/head/band
    lead: {}
  };

  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ Ring case ============ */

  var TOTAL_RINGS = 24;
  var COLS = 6, ROWSCT = 4;
  var ringMeta = [];

  (function buildRings(){
    var container = document.getElementById('caseRings');
    var colors = ['#A8834E', '#D9C4A9', '#EFE4D2'];
    var i = 0;
    for (var r = 0; r < ROWSCT; r++){
      for (var c = 0; c < COLS; c++){
        var baseX = (c + 0.5) / COLS * 100;
        var baseY = (r + 0.5) / ROWSCT * 100;
        var jitterX = (Math.sin(i * 12.9898) * 43758.5453 % 1) * 6 - 3;
        var jitterY = (Math.sin(i * 78.233) * 12543.135 % 1) * 6 - 3;
        var rot = ((Math.sin(i * 37.719) * 90000) % 1) * 40 - 20;
        var x = baseX + jitterX;
        var y = baseY + jitterY;
        var color = colors[i % colors.length];
        var hasStone = (i % 3 === 0);

        var dx = baseX - 50, dy = baseY - 50;
        var dist = Math.sqrt(dx*dx + dy*dy);

        ringMeta.push({ id:'ring-' + i, x:x, y:y, dist:dist });

        var div = document.createElement('div');
        div.className = 'ring';
        div.id = 'ring-' + i;
        div.style.left = x + '%';
        div.style.top = y + '%';
        div.style.transform = 'rotate(' + rot.toFixed(1) + 'deg)';
        div.innerHTML = '<svg viewBox="0 0 64 64" fill="none">' +
          '<circle cx="32" cy="32" r="19" stroke="' + color + '" stroke-width="3.2"/>' +
          (hasStone ? '<circle cx="32" cy="13" r="3" fill="' + color + '"/>' : '') +
          '</svg>';
        container.appendChild(div);
        i++;
      }
    }

    var order = ringMeta.slice().sort(function(a,b){ return b.dist - a.dist; });
    order.forEach(function(m, idx){
      m.rank = order.length - 1 - idx; // 0 = most central (last removed)
    });
  })();

  function setRingVisibility(count){
    ringMeta.forEach(function(m){
      var el = document.getElementById(m.id);
      var visible = m.rank < count;
      if (visible){ el.classList.remove('hidden'); }
      else { el.classList.add('hidden'); }
    });
  }
  setRingVisibility(RING_COUNTS.welcome);

  var frostEl = document.getElementById('frost');

  /* ============ Rendering ============ */

  var panel = document.getElementById('panel');
  var panelInner = document.getElementById('panelInner');
  var liveRegion = document.getElementById('liveRegion');

  function attrLine(o){
    return o.attr ? Object.assign({}, o.attr) : {};
  }

  function renderWelcome(){
    panelInner.innerHTML =
      '<p class="eyebrow">EOS Diamond</p>' +
      '<h1>Welcome to EOS</h1>' +
      '<p class="lede">Let’s find your ring.</p>' +
      '<button class="cta" id="beginBtn" type="button">Begin</button>';
    document.getElementById('beginBtn').addEventListener('click', function(){
      goTo(1, 'forward');
    });
  }

  function renderQuestion(qIndex){
    var q = QUESTIONS[qIndex];
    var selected = state.answers[q.key];
    var html = '<h2 class="prompt">' + q.prompt + '</h2>';
    html += '<div class="options' + (q.grid ? ' grid2' : '') + '" role="radiogroup" aria-label="' + q.prompt.replace(/"/g,'&quot;') + '" id="optionsGroup">';
    q.options.forEach(function(o, i){
      var isSel = selected === o.label;
      var diamondBit = '';
      if (q.key === 'q5_honeymoon' && o.attr && o.attr.shape){
        diamondBit = '<span class="diamond-mini" aria-hidden="true">' + DIAMOND_SHAPES[o.attr.shape] + '</span>';
      }
      html += '<button type="button" class="option" role="radio" aria-checked="' + isSel + '" ' +
        'tabindex="' + (i === 0 ? '0' : '-1') + '" data-index="' + i + '" data-label="' + o.label.replace(/"/g,'&quot;') + '">' +
        '<span class="icon" aria-hidden="true">' + ICONS[o.icon] + '</span>' +
        diamondBit +
        '<span class="label">' + o.label + '</span>' +
        '<span class="check" aria-hidden="true">' + CHECK + '</span>' +
        '</button>';
    });
    html += '</div>';
    if (qIndex > 0 || true){
      html += '<button type="button" class="back-link" id="backLink">Back</button>';
    }
    panelInner.innerHTML = html;

    var group = document.getElementById('optionsGroup');
    var buttons = Array.prototype.slice.call(group.querySelectorAll('.option'));

    function selectByIndex(i){
      var o = q.options[i];
      state.answers[q.key] = o.label;
      Object.assign(state.ring, attrLine(o));
      buttons.forEach(function(b){ b.setAttribute('aria-checked', 'false'); b.tabIndex = -1; });
      buttons[i].setAttribute('aria-checked', 'true');
      buttons[i].tabIndex = 0;
      window.setTimeout(function(){
        advanceFromQuestion();
      }, 150);
    }

    buttons.forEach(function(btn, i){
      btn.addEventListener('click', function(){ selectByIndex(i); });
      btn.addEventListener('keydown', function(e){
        var cols = q.grid ? (window.innerWidth >= 768 ? 3 : 2) : 1;
        var next = null;
        if (e.key === 'ArrowRight') next = i + 1;
        else if (e.key === 'ArrowLeft') next = i - 1;
        else if (e.key === 'ArrowDown') next = i + cols;
        else if (e.key === 'ArrowUp') next = i - cols;
        if (next !== null){
          e.preventDefault();
          next = Math.max(0, Math.min(buttons.length - 1, next));
          buttons.forEach(function(b){ b.tabIndex = -1; });
          buttons[next].tabIndex = 0;
          buttons[next].focus();
        }
      });
    });

    var backLink = document.getElementById('backLink');
    if (backLink){
      backLink.addEventListener('click', function(){
        goTo(state.screenIndex - 1, 'back');
      });
    }

    announceScreen(q.prompt, qIndex + 1, QUESTIONS.length);
  }

  function renderForm(){
    var html =
      '<p class="eyebrow">Almost there</p>' +
      '<h2>Tell us where to send it</h2>' +
      '<p class="sub">We’ll follow up within one business day.</p>' +
      '<form id="leadForm" novalidate>';

    function field(id, label, type, required, extra){
      return '<div class="field" id="field-' + id + '">' +
        '<label for="' + id + '">' + label + (required ? ' <span class="req">*</span>' : '') + '</label>' +
        (extra || ('<input type="' + type + '" id="' + id + '" name="' + id + '"' + (required ? ' aria-required="true"' : '') + '>')) +
        '<div class="field-error sr-only" id="err-' + id + '"></div>' +
        '</div>';
    }

    html += field('name', 'What should we call you?', 'text', true);
    html += field('partnerName', 'And who is this for?', 'text', true);
    html += field('email', 'Email', 'email', true);
    html += field('phone', 'Phone', 'tel', false);

    html += field('timeline', 'When are you hoping to propose?', null, true,
      '<select id="timeline" name="timeline" aria-required="true">' +
      '<option value="">Select one</option>' +
      '<option>Within 1 month</option><option>1–3 months</option>' +
      '<option>3–6 months</option><option>6–12 months</option>' +
      '<option>Just exploring</option></select>');

    html += field('surpriseOrJoint', 'Is this a surprise, or are you deciding together?', null, true,
      '<select id="surpriseOrJoint" name="surpriseOrJoint" aria-required="true">' +
      '<option value="">Select one</option>' +
      '<option>A complete surprise</option><option>We’re deciding together</option></select>');

    html += field('budget', 'A comfortable investment range?', null, true,
      '<select id="budget" name="budget" aria-required="true">' +
      '<option value="">Select one</option>' +
      '<option>Under $5,000</option><option>$5,000–$10,000</option>' +
      '<option>$10,000–$20,000</option><option>$20,000 and above</option>' +
      '<option>Prefer to discuss</option></select>');

    html += '<div class="field" id="field-notes">' +
      '<label for="notes">Notes &amp; style reference</label>' +
      '<textarea id="notes" name="notes"></textarea>' +
      '<label for="styleReference" style="margin-top:10px;">Reference link (optional)</label>' +
      '<input type="url" id="styleReference" name="styleReference" placeholder="https://…">' +
      '</div>';

    html += '<button class="cta" type="submit">See her ring</button>';
    html += '<div><button type="button" class="back-link" id="backLink" style="margin-top:16px;">Back</button></div>';
    html += '</form>';

    panelInner.innerHTML = html;

    var form = document.getElementById('leadForm');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      submitForm(form);
    });

    ['name','partnerName','email','phone','timeline','surpriseOrJoint','budget','notes','styleReference'].forEach(function(id){
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', function(){ clearFieldError(id); });
      el.addEventListener('change', function(){ clearFieldError(id); });
    });

    document.getElementById('backLink').addEventListener('click', function(){
      goTo(state.screenIndex - 1, 'back');
    });

    announceScreen('Tell us where to send it', null, null);
  }

  function clearFieldError(id){
    var fieldEl = document.getElementById('field-' + id);
    var errEl = document.getElementById('err-' + id);
    var inputEl = document.getElementById(id);
    if (fieldEl) fieldEl.classList.remove('invalid');
    if (errEl){ errEl.textContent = ''; errEl.classList.add('sr-only'); }
    if (inputEl) inputEl.removeAttribute('aria-invalid');
  }

  function setFieldError(id, message){
    var fieldEl = document.getElementById('field-' + id);
    var errEl = document.getElementById('err-' + id);
    var inputEl = document.getElementById(id);
    fieldEl.classList.add('invalid');
    errEl.textContent = message;
    errEl.classList.remove('sr-only');
    errEl.id = 'err-' + id;
    inputEl.setAttribute('aria-invalid', 'true');
    inputEl.setAttribute('aria-describedby', 'err-' + id);
  }

  function submitForm(form){
    var data = {
      name: form.name.value.trim(),
      partnerName: form.partnerName.value.trim(),
      email: form.email.value.trim(),
      phone: form.phone.value.trim(),
      timeline: form.timeline.value,
      surpriseOrJoint: form.surpriseOrJoint.value,
      budget: form.budget.value,
      notes: form.notes.value.trim(),
      styleReference: form.styleReference.value.trim()
    };

    var errors = [];
    if (!data.name) errors.push(['name', 'Please tell us what to call you.']);
    if (!data.partnerName) errors.push(['partnerName', 'Please tell us who this is for.']);
    if (!data.email) errors.push(['email', 'Please enter your email.']);
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) errors.push(['email', 'That email doesn’t look right.']);
    if (!data.timeline) errors.push(['timeline', 'Please pick a timeline.']);
    if (!data.surpriseOrJoint) errors.push(['surpriseOrJoint', 'Please pick one.']);
    if (!data.budget) errors.push(['budget', 'Please pick a range.']);

    ['name','partnerName','email','timeline','surpriseOrJoint','budget'].forEach(clearFieldError);

    if (errors.length){
      errors.forEach(function(pair){ setFieldError(pair[0], pair[1]); });
      document.getElementById(errors[0][0]).focus();
      liveRegion.textContent = 'There ' + (errors.length === 1 ? 'is 1 error' : 'are ' + errors.length + ' errors') + ' in the form.';
      return;
    }

    state.lead = data;

    var payload = {
      source: 'ring-finder-quiz',
      answers: {
        q1_datenight: state.answers.q1_datenight,
        q2_style: state.answers.q2_style,
        q3_season: state.answers.q3_season,
        q4_freetime: state.answers.q4_freetime,
        q5_honeymoon: state.answers.q5_honeymoon,
        q6_ringsize: state.answers.q6_ringsize,
        q7_matchingband: state.answers.q7_matchingband
      },
      ring: {
        metal: state.ring.metal,
        shape: state.ring.shape,
        setting: state.ring.setting,
        head: state.ring.head,
        band: state.ring.band
      },
      spec: buildSpec(),
      lead: {
        name: data.name,
        partnerName: data.partnerName,
        email: data.email,
        phone: data.phone,
        timeline: data.timeline,
        surpriseOrJoint: data.surpriseOrJoint,
        budget: data.budget,
        notes: data.notes,
        styleReference: data.styleReference
      },
      submittedAt: new Date().toISOString()
    };

    console.log(payload);

    goTo(SCREENS.length - 1, 'forward');
  }

  function buildSpec(){
    var r = state.ring;
    return r.metal + ' ' + r.shape.toLowerCase() + ' · ' +
      r.setting.toLowerCase() + ' setting · ' +
      r.head.toLowerCase() + ' head · ' +
      r.band.toLowerCase() + ' band';
  }

  function renderReveal(){
    var spec = buildSpec();
    var summaryItems = [
      state.answers.q1_datenight,
      state.answers.q2_style,
      state.answers.q3_season,
      state.answers.q4_freetime,
      state.answers.q5_honeymoon
    ];

    var html =
      '<p class="eyebrow">Curated for you</p>' +
      '<h2>Her ring</h2>' +
      '<p class="spec">' + spec + '</p>' +
      '<p class="reveal-body">Built from the way she already moves through the world — what she wears without thinking, the season she lights up in, and the honeymoon you’re already imagining together.</p>' +
      '<ul class="reveal-list">' +
      summaryItems.map(function(s){ return '<li>' + s + '</li>'; }).join('') +
      '</ul>' +
      '<p class="reveal-note">A member of our team will reach out within one business day.</p>';

    panelInner.innerHTML = html;
    frostEl.classList.add('clear');
    announceScreen('Her ring is ready', null, null);
  }

  function announceScreen(prompt, qNum, qTotal){
    var msg = prompt;
    if (qNum){ msg = 'Question ' + qNum + ' of ' + qTotal + '. ' + prompt; }
    liveRegion.textContent = msg;
  }

  /* ============ Screen transition (shutter) ============ */

  var transitioning = false;

  function renderScreen(){
    var name = SCREENS[state.screenIndex];
    if (name === 'welcome') renderWelcome();
    else if (name === 'form') renderForm();
    else if (name === 'reveal') renderReveal();
    else {
      var qIndex = SCREENS.indexOf(name) - 1;
      renderQuestion(qIndex);
    }
  }

  function advanceFromQuestion(){
    goTo(state.screenIndex + 1, 'forward');
  }

  function goTo(newIndex, direction){
    if (transitioning) return;
    if (newIndex < 0 || newIndex >= SCREENS.length) return;
    transitioning = true;

    var targetCount = RING_COUNTS[SCREENS[newIndex]];

    if (reducedMotion){
      panel.classList.add('fading');
      window.setTimeout(function(){
        setRingVisibility(targetCount);
        state.screenIndex = newIndex;
        renderScreen();
        panel.classList.remove('fading');
        transitioning = false;
      }, 200);
      return;
    }

    panel.classList.add('fading');
    window.setTimeout(function(){
      panel.classList.add('shut');
      window.setTimeout(function(){
        setRingVisibility(targetCount);
        state.screenIndex = newIndex;
        renderScreen();
        window.setTimeout(function(){
          panel.classList.remove('shut');
          panel.classList.remove('fading');
          window.setTimeout(function(){
            transitioning = false;
          }, 350);
        }, 20);
      }, 350);
    }, 100);
  }

  renderScreen();

})();
</script>
